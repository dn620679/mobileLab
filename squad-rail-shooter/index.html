<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101924">
<title>전선 돌파 | BREAKLINE</title>
<style>
:root{color-scheme:dark;--ink:#ecf6ff;--muted:#abc2d3;--line:#63809166;--aqua:#64f6db;--paper:#101b27;font-family:system-ui,"Malgun Gothic",sans-serif;background:#101924;color:var(--ink)}
*{box-sizing:border-box}body{margin:0;overflow:hidden;overscroll-behavior:none}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:2px solid white;outline-offset:4px}button:disabled{opacity:.4;cursor:default}[hidden]{display:none!important}
.shell{position:relative;display:grid;place-items:center;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#334656,#101924 66%)}.backmark{position:absolute;left:max(4vw,22px);bottom:8vh;font:900 clamp(40px,8vw,140px)/.72 system-ui;letter-spacing:-.105em;color:#ffffff08;pointer-events:none;user-select:none}
.arena{width:min(100vw,64dvh);height:100%;position:relative;overflow:hidden;background:#263b54;box-shadow:0 0 80px #020912b0;isolation:isolate;touch-action:none;user-select:none}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%}#labels{pointer-events:none}.hud{position:absolute;z-index:2;top:0;inset-inline:0;padding:max(13px,env(safe-area-inset-top)) max(13px,env(safe-area-inset-right)) 14px max(13px,env(safe-area-inset-left));background:linear-gradient(#111b2be8,#111b2b60 82%,transparent);pointer-events:none}.hud-top{display:flex;align-items:center;gap:8px}.hud-top button{pointer-events:auto}.stage{flex:1;min-width:0}.stage span,.count span,.micro{font:800 10px/1.15 ui-monospace,monospace;letter-spacing:.13em;color:var(--aqua)}.stage strong{display:block;margin-top:3px;font-size:clamp(15px,4vw,20px);line-height:1.2;white-space:nowrap}.count{display:flex;gap:4px;align-items:center;border-left:1px solid var(--line);padding-left:8px}.count strong{font:900 25px/1 ui-monospace,monospace}.tool{width:39px;height:39px;padding:0;display:grid;place-items:center;border:1px solid var(--line);border-radius:7px;background:#142536df;font-size:15px}.track{margin-top:10px;height:4px;background:#83aeb63c;border-radius:3px;overflow:hidden}.track i{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left;background:var(--aqua)}.boss{margin-top:10px;text-align:center}.boss span{font:900 11px/1 ui-monospace,monospace;letter-spacing:.14em;color:#ffd0bd}.boss .track{margin-top:5px;height:6px}.boss i{background:#ff765d}
.wave{position:absolute;z-index:2;top:21%;width:100%;text-align:center;color:white;font-size:clamp(15px,4vw,24px);font-weight:900;letter-spacing:.04em;text-shadow:0 2px 8px #071220;pointer-events:none}.wave span{display:inline-block;padding:5px 12px;border-block:1px solid #82aab68c;background:#142336b0}.bottom-hint{position:absolute;inset:auto 0 max(9px,env(safe-area-inset-bottom));text-align:center;color:#e7fcf5aa;font-size:11px;font-weight:750;pointer-events:none;text-shadow:0 2px 6px #061624}
.overlay{position:absolute;z-index:3;inset:0;display:grid;place-items:center;padding:max(66px,env(safe-area-inset-top)) 18px max(16px,env(safe-area-inset-bottom));background:linear-gradient(180deg,#0a172c7a,#101b2be2 74%,#0b1626);touch-action:pan-y;overflow:auto}.overlay-card{width:min(100%,355px);padding:22px 17px 17px;border:1px solid #7ba5b380;border-top:2px solid var(--aqua);background:linear-gradient(151deg,#223647f2,#111d2af7 63%);border-radius:8px;box-shadow:0 16px 60px #07101bc2}.overlay-card h1{font-size:clamp(37px,11vw,61px);letter-spacing:-.094em;line-height:1;margin:8px 0 12px}.overlay-card p{color:#c7dbe8;font-size:13px;line-height:1.65;margin:0 0 13px;white-space:pre-line}.action{display:block;width:100%;min-height:49px;margin-top:8px;padding:8px 10px;border:0;border-radius:5px;background:var(--aqua);color:#092c30;font-weight:900;letter-spacing:.025em}.action.alt{background:#243747;color:#e2f3f8;border:1px solid var(--line);min-height:42px}.upgrades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:9px}.upgrades button{min-height:52px;border:1px solid var(--line);border-radius:4px;background:#233444;font-size:11px;padding:4px 1px;font-weight:780}.upgrades small{display:block;color:#bff4e7;font:800 10px/1.4 ui-monospace,monospace}.bank{display:flex;justify-content:space-between;gap:7px;margin-top:10px;color:#ffe3a1;font:800 11px/1.3 ui-monospace,monospace}.bank span:last-child{color:#b3ced9}.error{margin:0;max-width:30ch;font-size:15px}.kbd{display:none}
@media(pointer:fine){.kbd{display:inline}}
@media(max-width:550px){.arena{width:100%}.backmark{display:none}}
@media(max-height:530px){.overlay{padding-block:42px 8px}.overlay-card{padding:12px}.overlay-card h1{font-size:32px;margin:4px 0 7px}.overlay-card p{font-size:11px;margin-bottom:6px}}
</style>
</head>
<body>
<main class="shell">
<div class="backmark" aria-hidden="true">BREAK<br>LINE</div>
<section class="arena" id="arena" aria-label="전선 돌파 3D 전장">
<canvas id="world" aria-hidden="true"></canvas><canvas id="labels" aria-hidden="true"></canvas>
<header class="hud">
<div class="hud-top">
<div class="stage"><span id="stage-code">OP / 01</span><strong id="stage-name"></strong></div>
<div class="count"><span>분대</span><strong id="troops">1</strong></div>
<button class="tool" id="sound" type="button" aria-label="효과음" aria-pressed="true">♪</button>
<button class="tool" id="pause" type="button" aria-label="일시정지">Ⅱ</button>
</div>
<div class="track" role="progressbar" aria-label="작전 진행률" aria-valuemin="0" aria-valuemax="100" id="progress"><i></i></div>
<div class="boss" id="boss-hud" hidden><span id="boss-name"></span><div class="track"><i></i></div></div>
</header>
<div class="wave" id="wave" role="status" hidden><span></span></div>
<div class="bottom-hint" id="hint" hidden>↔ 좌우로 드래그 <span class="kbd">· 방향키 또는 A/D</span></div>
<div class="overlay" id="overlay">
<div class="overlay-card">
<div class="micro" id="overline">BREAKLINE / 3D SQUAD RUN</div>
<h1 id="title">전선 돌파</h1>
<p id="copy"></p>
<button class="action" id="primary" type="button">작전 시작</button>
<button class="action alt" id="secondary" type="button" hidden>작전 선택</button>
<div class="bank" id="bank"><span id="coins"></span><span id="storage-status"></span></div>
<div class="upgrades" id="upgrades">
<button type="button" data-upgrade="troops">시작 병력<small></small></button>
<button type="button" data-upgrade="power">기본 공격<small></small></button>
<button type="button" data-upgrade="rate">기본 연사<small></small></button>
</div>
</div>
</div>
</section>
</main>

<script>
"use strict";
// The simulation is independent of the DOM and renderer.
const Breakline = (() => {
  const lanes = [-3.7, 0, 3.7];
  const ENEMY = {
    grunt: { hp: 3, speed: 6.5, radius: .43, hit: 1, color: 0xd14d50 },
    rush: { hp: 2, speed: 11, radius: .39, hit: 1, color: 0xf88546 },
    shield: { hp: 10, speed: 5.6, radius: .62, hit: 1, color: 0x9d455f },
    heavy: { hp: 20, speed: 4.6, radius: .85, hit: 2, color: 0xb75949 },
  };
  const REWARDS = {
    troops: { label: '병력', color: 0x53edd1, sign: '+', icon: '✚' },
    power: { label: '공격', color: 0xffbc62, sign: '+25%', icon: '▲' },
    rate: { label: '연사', color: 0x70b8ff, sign: '+25%', icon: '»' },
    spread: { label: '산탄', color: 0xf7de70, sign: '산탄', icon: '✦' },
    pierce: { label: '관통', color: 0xd1a4ff, sign: '관통탄', icon: '➤' },
  };
  // [seconds, lane, reward, amount, base durability]
  const STAGES = [
    { name: '외곽 검문소', boss: '램파트', tag: 'RAMPART', bossAt: 56, duration: 73, bossHp: 105, color: 0xf07855,
      reward: 58, waveGap: 2.1, waveSize: 4, unitTypes: ['grunt','grunt','rush','shield'],
      boxes: [[1,1,'troops',3,4],[8,0,'troops',4,10],[8,2,'power',1,13],[15,2,'troops',2,15],[15,0,'rate',1,16],
        [23,1,'spread',1,29],[29,0,'troops',5,29],[29,2,'pierce',1,33],[38,2,'troops',5,38],[38,0,'power',1,39],
        [47,1,'troops',6,49],[50,2,'rate',1,47]] },
    { name: '붉은 화물 지구', boss: '벌컨', tag: 'VULCAN', bossAt: 61, duration: 79, bossHp: 135, color: 0xe65d60,
      reward: 76, waveGap: 1.7, waveSize: 5, unitTypes: ['grunt','rush','shield','shield','heavy'],
      boxes: [[1,1,'troops',3,5],[7,2,'troops',3,12],[8,0,'pierce',1,15],[14,0,'troops',3,18],[17,2,'rate',1,20],
        [23,1,'power',1,28],[28,2,'troops',5,36],[32,0,'spread',1,39],[37,0,'troops',6,43],[42,2,'pierce',1,49],
        [48,1,'troops',6,58],[53,2,'power',1,59]] },
    { name: '최후의 방벽', boss: '오버시어', tag: 'OVERSEER', bossAt: 65, duration: 85, bossHp: 165, color: 0xdc77e8,
      reward: 105, waveGap: 1.55, waveSize: 6, unitTypes: ['rush','shield','grunt','heavy','heavy'],
      boxes: [[1,1,'troops',3,6],[7,0,'troops',3,14],[8,2,'spread',1,16],[14,2,'troops',3,21],[17,0,'power',1,25],
        [24,1,'pierce',1,30],[29,0,'troops',6,42],[33,2,'rate',1,46],[38,2,'troops',6,49],[43,0,'power',1,56],
        [49,1,'troops',7,64],[55,0,'pierce',1,67],[57,2,'spread',1,68]] },
  ];
  const UPGRADES = { troops: [30, 3], power: [40, 5], rate: [35, 5] };
  const SAVE_KEY = 'mobileLab.breakline.v1';
  const LIMITS = { soldiers: 32, enemies: 104, boxes: 12, bullets: 300, sparks: 170, fallen: 30, popups: 12 };
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  const approach = (from, to, strength, dt) => from + (to - from) * Math.min(1, strength * dt);
  function number(value, max) {
    return Number.isSafeInteger(value) ? clamp(value, 0, max) : 0;
  }
  function normalizeSave(input) {
    const raw = input?.version === 1 ? input : {};
    return { version: 1, coins: number(raw.coins, 999999), unlocked: number(raw.unlocked, STAGES.length - 1),
      sound: raw.sound !== false, seen: raw.seen === true,
      best: STAGES.map((_, i) => number(raw.best?.[i], 999999)),
      upgrades: Object.fromEntries(Object.entries(UPGRADES).map(([key, [, cap]]) => [key, number(raw.upgrades?.[key], cap)])) };
  }
  function cost(key, level) { return Math.round(UPGRADES[key][0] * 1.68 ** level); }
  function buy(save, key) {
    if (!Object.hasOwn(UPGRADES, key)) return false;
    const level = save.upgrades[key], price = cost(key, level);
    if (level >= UPGRADES[key][1] || save.coins < price) return false;
    save.coins -= price;
    save.upgrades[key]++;
    return true;
  }

  function pool(size) {
    return Array.from({ length: size }, () => ({ active: false }));
  }
  function slot(list) { return list.find(item => !item.active); }

  function create(stageIndex = 0, meta = {}, options = {}) {
    const stage = STAGES[stageIndex];
    const random = options.random || Math.random;
    const onEvent = options.onEvent || (() => {});
    const state = {
      stage, stageIndex, time: 0, x: 0, target: 0, count: 0, killed: 0, opened: 0, status: 'play',
      damage: 1 + .18 * (meta.power || 0), rate: 1 + .13 * (meta.rate || 0), spread: false, pierce: false,
      soldiers: pool(LIMITS.soldiers), enemies: pool(LIMITS.enemies), boxes: pool(LIMITS.boxes),
      bullets: pool(LIMITS.bullets), sparks: pool(LIMITS.sparks), fallen: pool(LIMITS.fallen), popups: pool(LIMITS.popups),
      boss: null, shake: 0, warning: null, quality: 1,
    };
    let nextWave = 5.4, wave = 0, nextBox = 0, bossBorn = false, uid = 0, invulnerable = 0;

    function addSoldiers(amount, fresh = true) {
      const added = Math.min(amount, LIMITS.soldiers - state.count);
      for (let i = 0; i < added; i++) {
        const s = slot(state.soldiers);
        Object.assign(s, { active: true, x: state.x + (i % 3 - 1) * .26, z: -.4 - i * .08, phase: random() * 8,
          cooldown: fresh ? .05 + i * .029 : .18 + i * .11, join: fresh ? .75 : 0, flash: 0 });
      }
      state.count += added;
      return added;
    }
    addSoldiers(1 + (meta.troops || 0), false);

    function burst(x, y, z, color, amount, strength = 1) {
      const count = Math.ceil(amount * state.quality);
      for (let i = 0; i < count; i++) {
        const p = slot(state.sparks);
        if (!p) break;
        const life = .18 + random() * .38;
        Object.assign(p, { active: true, x, y, z, color, life, duration: life, size: .035 + random() * .13,
          vx: (random() - .5) * 9 * strength, vy: (1 + random() * 6) * strength, vz: (random() - .5) * 9 * strength });
      }
    }

    function popup(x, z, text, color) {
      const p = slot(state.popups);
      if (p) Object.assign(p, { active: true, x, z, text, color, life: 1.05 });
    }

    function spawnBox(spec) {
      const [, lane, kind, amount, base] = spec;
      const b = slot(state.boxes);
      if (!b) return;
      const hp = Math.round(base * (1 + .018 * Math.max(0, state.count - 6)));
      Object.assign(b, { active: true, id: ++uid, x: lanes[lane], z: 26, hp, maxHp: hp, kind, amount, radius: 1.02,
        speed: 5.6, flash: 0, reward: REWARDS[kind] });
    }

    function spawnEnemy(type, x, z) {
      const e = slot(state.enemies);
      if (!e) return;
      const def = ENEMY[type];
      const hp = Math.ceil(def.hp * (1 + .13 * stageIndex));
      Object.assign(e, { ...def, hp, maxHp: hp, active: true, id: ++uid, type, x, home: x, z,
        phase: random() * 8, flash: 0, knock: 0, speed: def.speed * (.91 + random() * .18) });
    }

    function spawnWave() {
      wave++;
      const count = stage.waveSize + Math.floor(state.time / 14) + (wave % 4 === 0 ? 3 : 0);
      const primary = (wave + stageIndex * 2) % lanes.length;
      for (let i = 0; i < count; i++) {
        const lane = (primary + (wave % 4 === 0 ? i % 3 : Math.floor(i / 4))) % lanes.length;
        const pool = stage.unitTypes;
        const type = state.time < 15 ? (i % 5 === 4 ? 'rush' : 'grunt') : pool[(wave + i * 3) % pool.length];
        spawnEnemy(type, lanes[lane] + (i % 4 - 1.5) * .65, 29 + Math.floor(i / 3) * 2.2 + random() * 2);
      }
      if (wave === 1 || wave % 7 === 0) onEvent('wave', wave);
    }

    function spawnBoss() {
      bossBorn = true;
      const firepower = state.count * state.damage * state.rate * (state.spread ? 1.45 : 1);
      const hp = Math.round(stage.bossHp + firepower * (25 + stageIndex * 2.5));
      state.boss = { active: true, id: ++uid, type: 'boss', hp, maxHp: hp, x: 0, z: 43,
        radius: 2.4, speed: 4.0, color: stage.color, flash: 0, knock: 0, phase: 0, nextAttack: state.time + 2.8 };
      onEvent('boss', stage.boss);
    }

    function targets() {
      return state.boss?.active ? [state.boxes, state.enemies, [state.boss]] : [state.boxes, state.enemies];
    }

    function acquire(groups, soldier) {
      let picked = null, best = Infinity;
      for (const group of groups) for (const target of group) {
        if (!target.active || target.z <= soldier.z + .4 || target.z > 53) continue;
        const dx = Math.abs(target.x - state.x);
        const tolerance = (target.reward ? 1.05 : 1.30) + target.radius * .58 + target.z * .015;
        if (dx > tolerance) continue;
        const score = dx * 8 + target.z * .64 - (target.reward ? 7 : 0);
        if (score < best) { picked = target; best = score; }
      }
      return picked;
    }

    function shoot(soldier, groups) {
      const b = slot(state.bullets);
      if (!b) return;
      const goal = acquire(groups, soldier);
      const speed = 58;
      const z = soldier.z + .75;
      const travel = goal ? Math.max(.03, (goal.z - z) / (speed + goal.speed)) : 1;
      const vx = goal ? clamp((goal.x - soldier.x) / travel, -25, 25) : 0;
      Object.assign(b, { active: true, x: soldier.x + .10, z, y: 1.15, vx, speed, life: .96, dmg: state.damage,
        hits: state.pierce ? 3 : 1, hit1: 0, hit2: 0, lastX: soldier.x, lastZ: z - .3 });
      if (state.spread) for (const sign of [-1, 1]) {
        const pellet = slot(state.bullets);
        if (!pellet) break;
        Object.assign(pellet, b, { vx: vx + 10 * sign, dmg: state.damage * .54, life: .74 });
      }
      soldier.flash = .10;
      if (random() < .28) burst(soldier.x + .29, 1.13, z - .22, 0xfbd781, 1, .45);
      onEvent('shot');
    }

    function fall(unit, allied) {
      const corpse = slot(state.fallen);
      if (corpse) Object.assign(corpse, { active: true, x: unit.x, z: unit.z, type: unit.type || 'ally',
        color: allied ? 0x52bcfa : unit.color, life: .48, phase: unit.phase });
    }

    function removeSoldiers(amount, x) {
      if (invulnerable > 0) return;
      let removed = 0;
      for (let i = 0; i < amount; i++) {
        let nearest = null, best = Infinity;
        for (const soldier of state.soldiers) {
          if (!soldier.active) continue;
          const score = Math.abs(soldier.x - x) + soldier.z * .08;
          if (score < best) { best = score; nearest = soldier; }
        }
        if (!nearest) break;
        fall(nearest, true);
        burst(nearest.x, .8, nearest.z, 0x7ed9ff, 11);
        nearest.active = false;
        removed++;
      }
      if (!removed) return;
      state.count -= removed;
      invulnerable = .46;
      popup(state.x, 1.2, '−' + removed, 0xff846c);
      state.shake = .31;
      onEvent('hurt', removed);
      if (!state.count) end('loss');
    }

    function end(status) {
      if (state.status !== 'play') return;
      state.status = status;
      state.warning = null;
      onEvent(status);
    }

    function breakBox(box) {
      box.active = false;
      state.opened++;
      const { kind, x, z, reward, amount } = box;
      burst(x, 1.4, z, reward.color, 25, 1.15);
      let message = reward.sign;
      if (kind === 'troops') {
        const added = addSoldiers(amount);
        message = added ? '+' + added + ' 병력' : '분대 최대';
        burst(state.x, .45, 1, reward.color, 28, .9);
      } else if (kind === 'power') state.damage *= 1.25;
      else if (kind === 'rate') state.rate = Math.min(3.1, state.rate * 1.25);
      else if (kind === 'spread') {
        if (state.spread) { state.damage *= 1.12; message = '산탄 강화'; }
        state.spread = true;
      } else if (kind === 'pierce') {
        if (state.pierce) { state.damage *= 1.12; message = '관통 강화'; }
        state.pierce = true;
      }
      popup(kind === 'troops' ? state.x : x, kind === 'troops' ? 4 : z, message, reward.color);
      state.shake = .22;
      onEvent('crate', kind);
    }

    function damage(target, amount) {
      target.hp = Math.max(0, target.hp - amount);
      target.flash = .125;
      if (!target.reward) target.knock = Math.min(1.6, (target.knock || 0) + .45);
      if (target.hp > 0) {
        if (target.reward || random() < .38) burst(target.x, 1.2, target.z, target.reward?.color || 0xffc07b, 3);
        return;
      }
      if (target.reward) { breakBox(target); return; }
      target.active = false;
      state.killed++;
      if (target.type === 'boss') {
        burst(target.x, 2.5, target.z, stage.color, 75, 1.8);
        state.shake = .6;
        end('win');
      } else {
        fall(target, false);
        burst(target.x, .92, target.z, 0xff896c, 5);
        onEvent('kill');
      }
    }

    function hitBullet(b, groups) {
      // Use the segment for collision so fast tracers do not pass through small targets.
      let earliest = null, nearest = Infinity;
      for (const group of groups) for (const target of group) {
        if (!target.active || target.id === b.hit1 || target.id === b.hit2) continue;
        if (target.z + target.radius < b.lastZ || target.z - target.radius > b.z) continue;
        const f = clamp((target.z - b.lastZ) / (b.z - b.lastZ), 0, 1);
        const x = b.lastX + (b.x - b.lastX) * f;
        const d = Math.abs(target.x - x);
        if (d <= target.radius + .11 && target.z < nearest) { earliest = target; nearest = target.z; }
      }
      if (!earliest) return;
      damage(earliest, b.dmg);
      b.hits--;
      b.hit2 = b.hit1;
      b.hit1 = earliest.id;
      if (!b.hits || earliest.reward) b.active = false;
      else b.dmg *= .78;
    }

    function moveUnits(dt, allowCombat) {
      const shift = Math.min(2.30, .36 * (Math.min(5, Math.ceil(Math.sqrt(state.count * .85))) - 1));
      state.x = approach(state.x, clamp(state.target, -5.0 + shift, 5.0 - shift), 16, dt);
      const columns = clamp(Math.ceil(Math.sqrt(state.count * .9)), 1, 6);
      let index = 0;
      const groups = targets();
      for (const s of state.soldiers) {
        if (!s.active) continue;
        const row = Math.floor(index / columns), column = index % columns;

(() => {
